<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРМ "ЗАРИЯ-84" // ZARYA-84 OS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arg: {
                            bg: '#030705',
                            bezel: '#0a0f0d',
                            panel: 'rgba(7, 20, 15, 0.94)',
                            border: '#1b4d30',
                            green: '#00ff66',
                            cyan: '#00e5ff',
                            red: '#ff2a3b',
                            yellow: '#ffc800',
                            dim: '#436b53'
                        }
                    },
                    fontFamily: {
                        mono: ['"Anonymous Pro"', '"Share Tech Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #010403;
            color: #d1f7e2;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-mono-code {
            font-family: 'Anonymous Pro', 'Share Tech Mono', monospace;
        }

        .laptop-frame {
            background: linear-gradient(145deg, #151d18, #080d0a);
            border: 16px solid #0e1411;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.95), 0 25px 60px rgba(0,0,0,0.9);
            border-radius: 14px;
        }

        .glass-panel {
            background: rgba(6, 18, 13, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.22);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
        }

        .glass-window {
            background: rgba(5, 15, 11, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 102, 0.35);
            box-shadow: 0 14px 50px rgba(0, 0, 0, 0.92), 0 0 20px rgba(0, 255, 102, 0.08);
        }

        .scanlines {
            position: relative;
        }
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.38) 50%), linear-gradient(90deg, rgba(0, 255, 0, 0.02), rgba(0, 255, 102, 0.01), rgba(0, 100, 255, 0.02));
            z-index: 9999;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.65;
        }

        .redacted {
            background-color: #00ff66;
            color: #00ff66;
            border-radius: 2px;
            padding: 0 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .redacted:hover, .redacted.revealed {
            background-color: rgba(0, 255, 102, 0.22);
            color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(2, 8, 5, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #1b4d30;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ff66;
        }

        .glow-green { text-shadow: 0 0 12px rgba(0, 255, 102, 0.7); }
        .glow-red { text-shadow: 0 0 12px rgba(255, 42, 59, 0.85); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .window-header { cursor: move; }

        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
    </style>
</head>
<body class="h-full w-full scanlines font-sans overflow-hidden bg-arg-bg flex items-center justify-center p-2 sm:p-4">

    <!-- LAPTOP BEZEL FRAMEWORK -->
    <div class="laptop-frame relative w-full h-full max-w-7xl max-h-[920px] flex flex-col justify-between overflow-hidden shadow-2xl">

        <!-- Laptop Bezel Header & Hardware LEDs -->
        <div class="h-7 bg-arg-bezel w-full flex items-center justify-between px-4 text-[11px] font-mono-code text-arg-dim border-b border-arg-border/40 z-50 select-none">
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5">
                    <span id="ledPwr" class="w-2 h-2 rounded-full bg-arg-green animate-pulse"></span>
                    <span class="text-[10px] text-gray-400">PWR</span>
                </span>
                <span class="flex items-center gap-1.5">
                    <span id="ledHdd" class="w-2 h-2 rounded-full bg-arg-cyan/50"></span>
                    <span class="text-[10px] text-gray-400">HDD</span>
                </span>
                <span class="hidden sm:inline text-arg-green/80 font-bold ml-2" id="uiDeviceModel">БК-14МЛ // MIL-SPEC</span>
            </div>
            
            <!-- Laptop Webcam Lens -->
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-black border border-gray-700 flex items-center justify-center">
                    <div class="w-1 h-1 rounded-full bg-blue-800"></div>
                </div>
                <div id="camLed" class="w-1.5 h-1.5 rounded-full bg-arg-green/80 animate-ping" title="CAM ACTIVE"></div>
            </div>

            <div class="flex items-center gap-3">
                <span class="hidden sm:inline font-bold text-gray-300" id="uiHeaderOrg">ГРУ АФРФ</span>
            </div>
        </div>

        <!-- Background Radar Canvas -->
        <canvas id="bgCanvas"></canvas>

        <!-- ================================================================= -->
        <!-- LOCK SCREEN -->
        <!-- ================================================================= -->
        <div id="loginScreen" class="relative z-40 flex-1 flex flex-col items-center justify-between p-4 sm:p-8 transition-all duration-700">
            <div class="text-center mt-1 sm:mt-3 z-10">
                <div id="lockscreenTime" class="font-mono-code text-4xl sm:text-6xl font-bold tracking-wider text-white glow-green">14:00:00</div>
                <div id="lockscreenDate" class="font-mono-code text-xs sm:text-sm text-arg-green/80 mt-1 uppercase">МОСКВА, МО РФ // MSK TIME</div>
            </div>

            <div id="loginCard" class="glass-panel w-full max-w-md p-6 sm:p-8 rounded-2xl border border-arg-green/40 text-center relative overflow-hidden my-auto shadow-2xl transition-transform">
                <div class="relative inline-block mb-3">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-arg-border/50 border-2 border-arg-green flex items-center justify-center text-arg-green text-3xl sm:text-4xl shadow-[0_0_20px_rgba(0,255,102,0.3)]">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-4 h-4 bg-arg-green border-2 border-black rounded-full"></span>
                </div>

                <h2 id="loginHeading" class="font-mono-code text-base sm:text-lg font-bold text-white tracking-wide mb-1">АВТОРИЗАЦИЯ ПОЛЬЗОВАТЕЛЯ</h2>
                <p id="loginSubheading" class="font-mono-code text-xs text-arg-dim mb-4">ВВЕДИТЕ УЧЕТНЫЕ ДАННЫЕ</p>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3.5">
                    <div class="relative text-left">
                        <label id="lblUsername" class="block font-mono-code text-[11px] text-arg-green/90 mb-1">ИМЯ ПОЛЬЗОВАТЕЛЯ (USERNAME):</label>
                        <div class="relative">
                            <input type="text" id="loginUser" required placeholder="Username..." autofocus autocomplete="off"
                                class="w-full pl-9 pr-4 py-2 bg-black/80 border border-arg-border rounded-lg text-sm text-white font-mono-code focus:outline-none focus:border-arg-green focus:ring-1 focus:ring-arg-green transition">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-arg-dim text-xs"></i>
                        </div>
                    </div>

                    <div class="relative text-left">
                        <label id="lblPassword" class="block font-mono-code text-[11px] text-arg-green/90 mb-1">ПАРОЛЬ (PASSWORD):</label>
                        <div class="relative">
                            <input type="password" id="loginPass" required placeholder="Password..." autocomplete="off"
                                class="w-full pl-9 pr-10 py-2 bg-black/80 border border-arg-border rounded-lg text-sm text-white font-mono-code focus:outline-none focus:border-arg-green focus:ring-1 focus:ring-arg-green transition">
                            <i class="fa-solid fa-key absolute left-3 top-3 text-arg-dim text-xs"></i>
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-arg-dim hover:text-arg-green transition">
                                <i class="fa-solid fa-eye" id="passEyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div id="loginError" class="hidden p-2.5 rounded bg-arg-red/20 border border-arg-red/60 text-arg-red font-mono-code text-xs flex items-center gap-2 text-left">
                        <i class="fa-solid fa-triangle-exclamation text-sm shrink-0"></i>
                        <span id="loginErrorMsg">ОШИБКА АУТЕНТИФИКАЦИИ / AUTHENTICATION ERROR</span>
                    </div>

                    <button type="submit" id="btnSubmit"
                        class="w-full py-2.5 mt-2 bg-arg-green/20 hover:bg-arg-green/35 border border-arg-green text-arg-green font-mono-code font-bold tracking-wider rounded-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 glow-green">
                        <i class="fa-solid fa-right-to-bracket"></i> ВХОД В СИСТЕМУ
                    </button>
                </form>

                <div class="mt-4 pt-3 border-t border-arg-border/50 text-center font-mono-code text-[10px] text-arg-dim" id="uiTerminalFooter">
                    ЗАКРЫТЫЙ ТЕРМИНАЛ // МО РФ АФРФ
                </div>
            </div>

            <div class="w-full flex justify-between items-center font-mono-code text-xs text-arg-dim z-10">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-wifi text-arg-green"></i>
                    <span class="hidden sm:inline" id="uiStatusNet">СВЯЗЬ: АРМ-МОСКВА</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-battery-three-quarters text-arg-green"></i>
                    <span id="uiStatusBat">87% (ЗА
